# =============================================================================
# Hugo 站点配置
# 主题：PaperMod —— https://github.com/adityatelange/hugo-PaperMod
# 部署：GitHub Actions 构建 -> GitHub Pages（自定义域名）
# 仓库：https://github.com/luobai0110/luobai0110.github.io
# =============================================================================

# 站点对外访问地址：自定义域名 + 结尾斜杠。
# 这里必须和 GitHub Pages 的自定义域名一致，否则线上 CSS/JS/图片会 404。
baseURL: https://doomer.dpdns.org/

title: My New Hugo Project
theme: ["PaperMod"]

# --- 语言 ---------------------------------------------------------------
# `locale` 是 Hugo 0.158.0+ 的写法；旧的 `languageCode` 已被废弃
# （Hugo 会报 "deprecated: project config key languageCode" 警告）。
locale: zh-cn
defaultContentLanguage: zh-cn
# 中英文混排时按「字」而不是按「词」计算阅读时间、摘要等。
hasCJKLanguage: true

# --- 分类与标签（taxonomy） ----------------------------------------------
# 这两行是 Hugo 的默认值，显式写出来便于日后调整（例如把 tag 的链接改成 /topic/）。
# 配好之后 Hugo 会自动生成这些页面，不需要手写模板，且自带 RSS：
#   /categories/          所有分类的汇总（带每个分类的文章数）
#   /categories/某分类/    该分类下的文章列表
#   /tags/、/tags/某标签/  同理
# 用法 —— 在文章的 front matter 里写：
#   categories: ["随笔"]
#   tags: ["Hugo", "建站"]
taxonomies:
  category: categories
  tag: tags

# --- 构建输出 ------------------------------------------------------------
# 生成 robots.txt（主题自带模板）与 sitemap.xml，便于搜索引擎收录。
enableRobotsTXT: true

# PaperMod 的站内搜索页会读取 /index.json，所以首页需要额外输出 JSON。
# 若你不需要站内搜索，可以删掉这一段。
outputs:
  home:
    - HTML
    - RSS
    - JSON

# 列表分页：每页文章数。Hugo 0.128+ 使用 pagination.pagerSize（旧写法 paginate 已废弃）。
pagination:
  pagerSize: 10

# --- Markdown 渲染 -------------------------------------------------------
markup:
  goldmark:
    renderer:
      # 允许在 Markdown 里直接写 HTML（例如 <div align="center">）。
      unsafe: true
    extensions:
      # 保留 \( \) 与 $$ $$ 原样传递，配合 KaTeX/MathJax 渲染数学公式。
      # 不写公式的话可以删掉 passthrough。
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
  highlight:
    # PaperMod 的代码高亮依赖 CSS class，必须为 false（Hugo 默认是 true）。
    noClasses: false
    codeFences: true
    lineNos: true
    guessSyntax: true

# --- 导航菜单 ------------------------------------------------------------
# 菜单指向的页面来自这几处：
#   /posts/        content/posts/_index.md（section 首页）
#   /archives/     content/archives.md   （layout: archives）
#   /search/       content/search.md     （layout: search）
#   /categories/   taxonomy 自动生成
#   /tags/         taxonomy 自动生成
# weight 越小越靠左。
menu:
  main:
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 10
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 20
    - identifier: categories
      name: 分类
      url: /categories/
      weight: 30
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 40
    - identifier: search
      name: 搜索
      url: /search/
      weight: 50

# --- 站点参数 ------------------------------------------------------------
params:
  # production 会启用主题的生产环境行为（例如 opengraph 完整输出）。
  env: production
  description: "My New Hugo Project"
  author: luobai0110
  keywords: [Blog, Hugo, PaperMod]

  # auto = 跟随系统深浅色；也可写 light / dark
  defaultTheme: auto
  disableThemeToggle: false

  # 首页要列出哪些 section 的文章。PaperMod 的首页列表和归档页都直接读这个值，
  # 不配置的话首页/归档会是空列表。对应 content/posts/ 目录。
  mainSections: ["posts"]

  # 归档页是否列出全站所有页面（含非 mainSections 的页面）。
  # 保持 false —— 否则 /archives/ 和 /search/ 这两个页面自己也会被归档进去。
  ShowAllPagesInArchive: false

  # 文章页显示项
  ShowReadingTime: true
  ShowWordCount: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  UseHugoToc: true
  ShowShareButtons: false
  ShowCanonicalLink: false
  ShowRssButtonInSectionTermList: true
  comments: false

  # 首页顶部的一段自我介绍。不需要可以整段删除。
  homeInfoParams:
    Title: "你好 👋"
    Content: "欢迎来到我的站点。"

  # 页脚：版权行默认自动输出 “© 年份 站点标题”。
  # 想换成自己的声明，用根级 copyright（取消注释并改写）：
  # copyright: "© 2026 luobai0110，文章采用 CC BY-NC-SA 4.0 许可协议"
  footer:
    hideCopyright: false
    # text: "本站由 Hugo + PaperMod 驱动"   # 追加在版权行后面，支持 Markdown

  # 社交图标：name 必须是主题内置的图标名（见主题 layouts/_partials/svg.html，
  # 常见的有 github / email / x / bilibili / zhihu / youtube / rss 等）。
  socialIcons:
    - name: github
      url: https://github.com/luobai0110
    # - name: email
    #   url: mailto:you@example.com

  # 静态资源指纹（加 hash 后缀，利于缓存）与网站图标。
  # 图标文件放进 static/ 就会自动生效；不提供的话浏览器每次都会请求这几个文件
  # 并拿到 404（不影响功能，但控制台会报错），需要的话取消注释：
  assets:
    disableFingerprinting: false
    # favicon: "favicon.ico"
    # favicon16x16: "favicon-16x16.png"
    # favicon32x32: "favicon-32x32.png"
    # apple_touch_icon: "apple-touch-icon.png"
    # safari_pinned_tab: "safari-pinned-tab.svg"
    # theme_color: "#2e2e33"

  # 站内搜索的模糊匹配参数（配合 content/search.md 使用）
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

  # 头部 logo（默认直接用站点标题）
  # label:
  #   text: "首页"
  #   icon: "logo.png"      # 放在 assets/ 目录下
  #   iconHeight: 35

  # 文章页日期格式，默认 :date_long（中文下形如 “2026年1月1日”）
  # DateFormat: "2006-01-02"

  # 文章页右下角的「编辑此页」链接
  # editPost:
  #   URL: "https://github.com/luobai0110/luobai0110.github.io/tree/main/content"
  #   Text: "编辑此页"
  #   appendFilePath: true

# --- 其他可选 ------------------------------------------------------------
# 用 git 提交时间为文章最后修改时间（CI 里已用 fetch-depth: 0，可以开启）
# enableGitInfo: true
